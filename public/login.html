<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayNova - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080d1b;
      color: white;
      font-family: Arial, sans-serif;
    }
    .login-box {
      width: 90%;
      max-width: 380px;
      padding: 30px;
      background: #151e32;
      border: 1px solid #263653;
      border-radius: 15px;
      text-align: center;
    }
    h1 { color: #00d4ff; margin-bottom: 8px; }
    p { color: #aab7cc; }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #34445f;
      border-radius: 8px;
      background: #0b1324;
      color: white;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #00d4ff;
      color: #07111c;
      font-weight: bold;
      font-size: 16px;
    }
    a { color: #00d4ff; text-decoration: none; }
    .message { margin-top: 15px; color: #ffd166; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>PLAYNOVA</h1>
    <p>Welcome Back!</p>

    <form id="loginForm">
      <input type="text" placeholder="Username or Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>

    <div class="message" id="message"></div>

    <p>Don't have an account? <a href="register.html">Register</a></p>
    <p><a href="index.html">← Back to Home</a></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Demo only: Login authentication is not connected yet.";
    });
  </script>
</body>
</html>
